server:
  port: 8083

spring:
  application:
    name: ms-pedidos360-notify

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbit1-pedidos360}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3