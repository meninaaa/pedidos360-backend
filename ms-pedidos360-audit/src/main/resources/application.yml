server:
  port: 8084

spring:
  application:
    name: ms-audit

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:oracle:thin:@oracle-pedidos360:1521/XEPDB1
    username: pedidos360
    password: password
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 120000
      maximum-pool-size: 5
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-1:29092,kafka-2:29093,kafka-3:29094}
    consumer:
      group-id: audit-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.pedidos360.audit_service.dto.OrderEventDTO
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/999128ab-cdb0-42d7-892c-d7e8752556f9/v2.0
          audiences: d7430172-cf9c-438e-8a3a-210f88d2d23c