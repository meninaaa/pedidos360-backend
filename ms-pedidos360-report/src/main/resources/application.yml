server:
  port: 8085

spring:
  application:
    name: ms-report
  
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:oracle:thin:@oracle-pedidos360:1521/XEPDB1
    username: pedidos360
    password: password
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 120000
      maximum-pool-size: 5
      initialization-fail-timeout: 0
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-pedidos360:29092}
    consumer:
      group-id: report-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/999128ab-cdb0-42d7-892c-d7e8752556f9/v2.0
          audiences: api://d7430172-cf9c-438e-8a3a-210f88d2d23c